<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#2d1b0e"/>

  <!-- Dirt mound -->
  <ellipse cx="32" cy="52" rx="22" ry="10" fill="#6b3f1f"/>
  <ellipse cx="32" cy="50" rx="18" ry="8" fill="#7d4a24"/>

  <!-- Burrow hole -->
  <ellipse cx="32" cy="48" rx="10" ry="5" fill="#1a0d06"/>

  <!-- Mole body -->
  <ellipse cx="32" cy="36" rx="12" ry="14" fill="#5a5a6e"/>

  <!-- Mole head -->
  <circle cx="32" cy="26" r="11" fill="#6b6b80"/>

  <!-- Ears -->
  <ellipse cx="22" cy="20" rx="4" ry="5" fill="#6b6b80"/>
  <ellipse cx="42" cy="20" rx="4" ry="5" fill="#6b6b80"/>
  <ellipse cx="22" cy="20" rx="2" ry="3" fill="#d48fa0"/>
  <ellipse cx="42" cy="20" rx="2" ry="3" fill="#d48fa0"/>

  <!-- Eyes (tiny, moles have poor sight) -->
  <circle cx="27" cy="25" r="2" fill="#1a1a2e"/>
  <circle cx="37" cy="25" r="2" fill="#1a1a2e"/>
  <circle cx="27.6" cy="24.4" r="0.6" fill="#fff"/>
  <circle cx="37.6" cy="24.4" r="0.6" fill="#fff"/>

  <!-- Snout -->
  <ellipse cx="32" cy="31" rx="4" ry="3" fill="#b07070"/>
  <circle cx="31" cy="30" r="1" fill="#8a4444"/>
  <circle cx="33" cy="30" r="1" fill="#8a4444"/>

  <!-- Claws peeking over mound -->
  <line x1="20" y1="46" x2="18" y2="42" stroke="#3d2d1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="23" y1="45" x2="21" y2="41" stroke="#3d2d1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="44" y1="46" x2="46" y2="42" stroke="#3d2d1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="41" y1="45" x2="43" y2="41" stroke="#3d2d1a" stroke-width="2" stroke-linecap="round"/>
</svg>
